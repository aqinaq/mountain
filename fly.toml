# Fly.io configuration.
#
# This app keeps every byte of its state — the SQLite database and the uploaded
# books — on one local disk, so it is deliberately a single-machine deployment.
# Do not scale it past one machine: a second one would come up with its own
# empty volume and serve a different library, and two writers on one SQLite
# file is not something this setup arranges for.

app = "mountain"
primary_region = "fra"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Suspend rather than stop: the machine's memory is snapshotted to disk, so
  # an idle reader coming back resumes in about a second instead of paying for
  # a cold boot. Going down to zero while nobody is reading is what keeps a
  # single-user app from being billed around the clock.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "mountain_data"
  destination = "/app/data"
  initial_size = "3gb"

[[vm]]
  size = "shared-cpu-1x"
  # Parsing a large PDF through pdfjs is the memory high-water mark here; 512mb
  # is enough to get killed on a big book.
  memory = "1gb"
